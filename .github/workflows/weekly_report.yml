name: Weekly Market Brief

on:
  schedule:
    # Fridays at 22:00 UTC — after the NYSE close year-round. The close is
    # 21:00 UTC under EST and 20:00 UTC under EDT, and GitHub cron has no DST
    # handling, so this single time clears the bell by an hour in winter and
    # two in summer, leaving room for the daily bars to settle.
    # Friday 23:00 UK in summer / 22:00 in winter; 00:00 SAST Saturday.
    #
    # A cloud routine republishes the committed page to the Artifact an hour
    # later; if you move this time, move that one with it.
    - cron: '0 22 * * 5'

  workflow_dispatch:

# Needed to push the rebuilt page back to the repo.
permissions:
  contents: write

jobs:
  build-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the brief
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build_report_html.py --out weekly/weekly_brief.html

      - name: Commit the rebuilt page
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly/weekly_brief.html
          # The page carries a build timestamp, so it differs every run; this
          # guard only catches a run that produced no file at all.
          if git diff --staged --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "Rebuild the weekly market brief ($(date -u +%Y-%m-%d))"
          git push
