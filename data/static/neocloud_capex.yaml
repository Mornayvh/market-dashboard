# Neocloud quarterly capex — Nebius (NBIS) only.
# CoreWeave (CRWV) is NOT in this file: it files 10-Qs, so its quarters come live
# from SEC EDGAR (see CapexChart members in config.py). Nebius is a Dutch 20-F/6-K
# filer with no quarterly US-GAAP XBRL, so its series is hand-entered here.
#
# UPDATE QUARTERLY: pull from Nebius 6-K earnings releases ("Capital expenditures
# totaled $X for the three months ended ..."). Q2/Q3 are disclosed as H1/9M YTD —
# difference them against the prior quarter's YTD.

last_updated: "2026-06-12"
unit: "USD billions"
sources:
  NBIS: "Nebius Group 6-K earnings releases (capex as disclosed; Q2/Q3 derived from H1/9M YTD)"
notes: |
  All values verified against the SEC-filed 6-K exhibits on 2026-06-12.
  2024Q2 and earlier are omitted: capex was not separately disclosed before the
  Q3 2024 trading update (Yandex-era consolidated reporting).
  Q4'25 (~$2.1bn) and Q1'26 (~$2.5bn) are disclosed as approximate figures.
  Capex is total property/equipment purchases; majority is GPU & DC infrastructure.

